<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>구구단 출력</title>
</head>
<body>
    <script>
        for (let a = 2; a <= 9; a++) {
            document.write("<h3>--- " + a + "단 ---</h3>");

            for (let b = 1; b <= 9; b++) {
                let reward = a * b;
                document.write(a + " × " + b + " = " + reward + "<br>");
            }
            document.write("<br>"); 
        }
    </script>
</body>
</html>
